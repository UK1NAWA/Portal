<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h2>Login</h2>

    <div id="errorMsg" style="display:none; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3);
        color:#f87171; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px;"></div>
    <div id="successMsg" style="display:none; background:rgba(62,207,142,0.12); border:1px solid rgba(62,207,142,0.3);
        color:#3ecf8e; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px;"></div>

    <form action="login.php" method="POST">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required autocomplete="current-password">

        <button type="submit">Login</button>
    </form>
    <p style="margin-top:14px;">
        New student?
        <a href="index.html">Register here</a>
    </p>
    <p style="margin-top:10px; font-size:12px; color:#6b7280; text-align:center;">
        <a href="privacy.html" style="color:#6b7280; text-decoration:none;">Privacy Policy</a>
        &nbsp;&middot;&nbsp;
        <a href="terms.html" style="color:#6b7280; text-decoration:none;">Terms of Use</a>
    </p>
</div>

<script>
const loginErr = sessionStorage.getItem('loginError');
const regErr   = sessionStorage.getItem('regError');
const regOk    = sessionStorage.getItem('regSuccess');

// Show session timeout message
if (new URLSearchParams(window.location.search).get('reason') === 'timeout') {
    const el = document.getElementById('errorMsg');
    el.textContent = 'Your session expired due to inactivity. Please log in again.';
    el.style.display = 'block';
}

if (loginErr) {
    const el = document.getElementById('errorMsg');
    el.textContent = loginErr;
    el.style.display = 'block';
    sessionStorage.removeItem('loginError');
}
if (regErr) {
    const el = document.getElementById('errorMsg');
    el.textContent = regErr;
    el.style.display = 'block';
    sessionStorage.removeItem('regError');
}
if (regOk) {
    const el = document.getElementById('successMsg');
    el.textContent = regOk;
    el.style.display = 'block';
    sessionStorage.removeItem('regSuccess');
}
</script>

</body>
</html>
